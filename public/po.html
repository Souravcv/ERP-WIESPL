<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your Purchase Order – WIESPL</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1f4e9a">
  <link rel="icon" href="logo.jpeg">
  <link rel="stylesheet" href="css/enquire.css">
  <style>
    .po-main{max-width:760px;margin:0 auto;padding:16px}
    .po-main h1{font-size:1.3rem;margin:.2em 0}
    .po-main table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.92rem}
    .po-main th,.po-main td{border-bottom:1px solid #d9dfe8;padding:6px 8px;text-align:left}
    .po-main td.n,.po-main th.n{text-align:right}
    .po-box{background:#f4f7fb;border:1px solid #d9dfe8;border-radius:10px;padding:12px;margin:12px 0}
    .po-main label{display:block;margin:10px 0 4px;font-weight:600}
    .po-main input[type=text]{width:100%;padding:10px;border:1px solid #b8c2d1;border-radius:8px;font-size:1rem;box-sizing:border-box}
    .po-sig{border:2px dashed #8aa0bf;border-radius:8px;background:#fff;touch-action:none;width:100%;height:150px;display:block}
    .po-btn{background:#1f4e9a;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:1rem;cursor:pointer;margin-top:12px}
    .po-btn.sec{background:#e5eaf2;color:#1f2d44;margin-left:8px}
    .po-err{color:#b3261e;margin-top:8px}.po-ok{background:#e6f4ea;border:1px solid #9ccfa8;border-radius:10px;padding:14px;margin:12px 0}
  </style>
</head>
<body>
  <header class="eq-top">
    <img src="logo.jpeg" alt="" class="eq-logo">
    <div class="eq-brand"><b id="eq-company">WIESPL</b><span>Purchase order approval</span></div>
  </header>
  <main class="po-main" id="po-main"><p>Loading…</p></main>
  <noscript><p>Please turn on JavaScript to use this page.</p></noscript>
  <script type="module" src="js/po.js"></script>
</body>
</html>
